# Multiple-choice questions shown at the end of each lesson, keyed by lesson number.
# `answer` is the position of the right option, counting from 0.

1:
- question: Which function draws a horizontal line between sections?
  options:
  - st.line()
  - st.divider()
  - st.hr()
  - st.separator()
  answer: 1
  explanation: st.divider() draws the horizontal line.
2:
- question: What does st.button() return on the rerun right after it is clicked?
  options:
  - 'False'
  - None
  - The button label
  - 'True'
  answer: 3
  explanation: It returns True for that one run, then goes back to False.
3:
- question: Which function splits the page into side-by-side sections?
  options:
  - st.tabs()
  - st.columns()
  - st.container()
  - st.sidebar
  answer: 1
  explanation: st.columns() gives you side-by-side sections.
4:
- question: Which function shows an interactive table you can sort and scroll?
  options:
  - st.table()
  - st.json()
  - st.dataframe()
  - st.metric()
  answer: 2
  explanation: st.dataframe() is interactive. st.table() is static.
5:
- question: Which two columns does st.map() look for in your data?
  options:
  - x and y
  - city and country
  - name and value
  - lat and lon
  answer: 3
  explanation: st.map() plots points from latitude and longitude columns.
6:
- question: Which function lets the user save a file that your app generates?
  options:
  - st.download_button()
  - st.file_uploader()
  - st.image()
  - st.save()
  answer: 0
  explanation: st.download_button() offers a file for download. st.file_uploader() is the reverse.
7:
- question: Which st.markdown() argument allows raw HTML and CSS?
  options:
  - html=True
  - allow_css=True
  - unsafe_allow_html=True
  - raw=True
  answer: 2
  explanation: unsafe_allow_html=True turns on raw HTML. Only use it with content you trust.
8:
- question: Which function shows a small, temporary notification in the corner?
  options:
  - st.success()
  - st.progress()
  - st.balloons()
  - st.toast()
  answer: 3
  explanation: st.toast() shows a short-lived message in the corner of the screen.
9:
- question: What happens to ordinary Python variables on every rerun?
  options:
  - They keep their value
  - They are reset
  - They are saved to disk
  - They move into session state
  answer: 1
  explanation: The whole script runs again, so plain variables start fresh. Use st.session_state to remember things.
- question: Where is the value of a widget with key='username' stored?
  options:
  - st.session_state['username']
  - st.cache_data
  - A file named username
  - Nowhere, it is lost
  answer: 0
  explanation: Every widget with a key stores its value in st.session_state under that key.
10:
- question: When does an st.form() rerun the app?
  options:
  - After every keystroke
  - Only when the submit button is pressed
  - Every second
  - Never
  answer: 1
  explanation: Widgets inside a form wait until the submit button is pressed.
11:
- question: Which decorator suits a shared ML model or database connection?
  options:
  - st.cache_data
  - st.session_state
  - st.cache_resource
  - st.form
  answer: 2
  explanation: st.cache_resource returns the same shared object every time.
- question: Which argument makes a cache entry expire after a number of seconds?
  options:
  - expire
  - ttl
  - timeout
  - max_age
  answer: 1
  explanation: ttl, for example @st.cache_data(ttl=60), keeps results for 60 seconds.
12:
- question: Which function shows a chat bubble for a role such as 'user'?
  options:
  - st.chat_message()
  - st.chat_input()
  - st.write_chat()
  - st.bubble()
  answer: 0
  explanation: st.chat_message() draws the bubble. st.chat_input() is the box you type in.
13:
- question: Which function jumps to another page from code, for example after a button click?
  options:
  - st.page_link()
  - st.switch_page()
  - st.goto()
  - st.redirect()
  answer: 1
  explanation: st.switch_page() moves the user. st.page_link() only shows a clickable link.
14:
- question: Why is the session-state login on this page not safe for real passwords?
  options:
  - Session state is deleted too fast
  - Forms cannot hold passwords
  - The username and password are written directly in the code
  - st.error() leaks the password
  answer: 2
  explanation: Anyone who can read the code can read the password. Real apps use an identity provider, for example with st.login().
15:
- question: Which function turns a function into a pop-up window on top of the page?
  options:
  - st.popup()
  - st.modal_window()
  - st.dialog()
  - st.overlay()
  answer: 2
  explanation: '@st.dialog turns a function into a pop-up. Call the function to open it.'
- question: Which function shows the progress of a longer task with a label and a state?
  options:
  - st.status()
  - st.progress_text()
  - st.popover()
  - st.toast()
  answer: 0
  explanation: st.status() shows a task as it runs, and can be updated to "complete" when done.
16:
- question: What does st.data_editor() return?
  options:
  - True when the table is edited
  - The edited data, as a DataFrame
  - Only the rows that changed
  - Nothing
  answer: 1
  explanation: It returns the table with the user's edits, in the same type you passed in.
- question: What does st.feedback("stars") return when the user clicks the third star?
  options:
  - '3'
  - '2'
  - '"3 stars"'
  - 'True'
  answer: 1
  explanation: 'It counts from zero: one star is 0 and five stars is 4. Add 1 to show the rating.'
17:
- question: What does st.fragment let you do?
  options:
  - Cache a function forever
  - Split a page into several files
  - Rerun just one part of the page
  - Delete session state
  answer: 2
  explanation: A fragment reruns on its own, so the rest of the script does not run again.
- question: What can you give st.write_stream()?
  options:
  - A generator that yields pieces of text
  - A single finished string only
  - A DataFrame only
  - A file path
  answer: 0
  explanation: It writes whatever a generator yields piece by piece, like a chatbot typing.
18:
- question: Where should a real API key live?
  options:
  - Directly in your Python code
  - In .streamlit/secrets.toml, kept out of Git
  - In the README so it is easy to find
  - In a code comment
  answer: 1
  explanation: st.secrets reads it from secrets.toml, which belongs in .gitignore. On Community Cloud you paste its contents into the app's Secrets settings.
- question: Which file tells Community Cloud which Python packages to install?
  options:
  - README.md
  - .gitignore
  - requirements.txt
  - Home.py
  answer: 2
  explanation: The cloud starts with nothing installed, so list every package in requirements.txt.
19:
- question: What does a failing assert do?
  options:
  - Prints a warning and carries on
  - Raises an AssertionError
  - Restarts the app
  - Nothing
  answer: 1
  explanation: A failed assert raises an AssertionError, which is how test tools notice a failure.
- question: What is AppTest for?
  options:
  - Checking what an app shows without opening a browser
  - Making the app load faster
  - Deploying the app
  - Styling the app
  answer: 0
  explanation: AppTest runs your app in memory so a test can click, type and read the result.
20:
- question: Why keep some flowers hidden while the model is trained?
  options:
  - To make training faster
  - To check the model on flowers it has never seen
  - Because the data is too big
  - To remove wrong flowers
  answer: 1
  explanation: A model can memorise the flowers it learned from. Scoring on hidden flowers shows how it does on new ones.
- question: What does predict_proba() return?
  options:
  - The name of the species
  - The model's chance for each species
  - The accuracy of the model
  - The training data
  answer: 1
  explanation: It returns one number per species, and they add up to 1.
21:
- question: Which pandas code adds up the revenue of each region?
  options:
  - sales.sort("Region")
  - sales.groupby("Region")["Revenue"].sum()
  - sales.filter("Region")
  - sales.merge("Region")
  answer: 1
  explanation: groupby() splits the table into one group per region, and sum() adds each group up.
- question: What does sales["Region"].isin(["North", "South"]) give you?
  options:
  - The number of regions
  - True for rows in North or South, False for the rest
  - The sum of those regions
  - A new table with two columns
  answer: 1
  explanation: It returns True or False for every row. Use it inside sales[...] to keep only those rows.
22:
- question: Why does the chatbot store its messages in st.session_state?
  options:
  - The page reruns on every message and would otherwise forget the conversation
  - To make the bot answer faster
  - To hide the messages
  - To save them to a file
  answer: 0
  explanation: Every message reruns the script, so ordinary variables reset. Session state keeps the history between reruns.
- question: Why must a public app never contain your own API key?
  options:
  - Keys make the app slower
  - Every visitor would spend your credit
  - Keys cannot be read by Python
  - Streamlit forbids keys
  answer: 1
  explanation: Anyone using the app would be using your account. Keep keys in st.secrets, or ask each visitor for their own.
