# Opens a pull request when a dependency has a new version.
version: 2
updates:
  # The GitHub Actions used in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  # Python packages in requirements.txt (it only acts on packages that have a
  # version number, for example "streamlit>=1.50")
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
